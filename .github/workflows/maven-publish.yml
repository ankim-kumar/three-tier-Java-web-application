name: Java CICD

on:
  push:
    branches: ["containers"]
  pull_request:
    branches: ["containers"]

jobs:

  gitleaks:
    runs-on: self-hosted
    steps: 
      - uses: actions/checkout@v4 

      - name: Run Gitleaks 
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --exit-code 1


  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Maven Test
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle
        

  trivy:
    runs-on: self-hosted
    needs: testing
    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH


  docker_build_push:
    runs-on: self-hosted
    needs: trivy
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build & Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker-files/app/Dockerfile
          push: true
          tags: |
            ankim628/threevproapp:containers-${{ github.run_number }}


      - name: Build & Push DB Image
        uses: docker/build-push-action@v5
        with:
          context: Docker-files/db
          file: Docker-files/db/Dockerfile
          push: true
          tags: |
            ankim628/threevpromysql:containers-${{ github.run_number }}


      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: Docker-files/web
          file: Docker-files/web/Dockerfile
          push: true
          tags: |
            ankim628/threevproweb:containers-${{ github.run_number }}


  deploy-gke:
    runs-on: self-hosted
    needs: docker_build_push
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_REGION }}

      - name: Install NGINX Ingress Controller
        run: |
          kubectl get ns ingress-nginx || kubectl create ns ingress-nginx
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.0/deploy/static/provider/cloud/deploy.yaml

      - name: Wait for Ingress Controller
        run: |
          kubectl rollout status deployment ingress-nginx-controller -n ingress-nginx --timeout=300s    

      - name: Deploy to GKE
        run: |
          kubectl apply -f kubedefs/namespace.yaml
          kubectl apply -f kubedefs/secret.yaml
          kubectl apply -f kubedefs/dbpvc.yaml
          kubectl apply -f kubedefs/dbdeploy.yaml
          kubectl apply -f kubedefs/dbservice.yaml
          kubectl apply -f kubedefs/mcdep.yaml
          kubectl apply -f kubedefs/mcservice.yaml
          kubectl apply -f kubedefs/rmqdeploy.yaml
          kubectl apply -f kubedefs/rmqservice.yaml
          kubectl apply -f kubedefs/appdeploy.yaml
          kubectl apply -f kubedefs/appservice.yaml
          kubectl apply -f kubedefs/appingress.yaml 
          
