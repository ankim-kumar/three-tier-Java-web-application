# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Java CICD

on:
  push:
    branches: ["containers", "main"]
  pull_request:
    branches: ["containers"]

jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --exit-code 1


  trivy:
    runs-on: self-hosted
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH


  docker_build_push:
    runs-on: self-hosted
    needs: trivy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- APP ----------
      - name: Build & Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker-files/app/Dockerfile
          push: true
          tags: |
            ankim628/threevproapp:${{ github.ref_name }}-${{ github.run_number }}
            ankim628/threevproapp:${{ github.ref_name }}-${{ github.sha }}

      # ---------- DB ----------
      - name: Build & Push DB Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker-files/db/Dockerfile
          push: true
          tags: |
            ankim628/threevpromysql:${{ github.ref_name }}-${{ github.run_number }}

      # ---------- WEB ----------
      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker-files/web/Dockerfile
          push: true
          tags: |
            ankim628/threevproweb:${{ github.ref_name }}-${{ github.run_number }}

      # ---------- PROD LATEST ----------
      - name: Tag latest (main only)
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker-files/app/Dockerfile
          push: true
          tags: ankim628/threevproapp:latest
