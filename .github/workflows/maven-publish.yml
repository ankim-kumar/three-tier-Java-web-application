name: Java CICD

on:
  push:
    branches: ["containers"]
  pull_request:
    branches: ["containers"]

jobs:
  # ---------------- SECURITY: GITLEAKS ----------------
  gitleaks:
    runs-on: self-hosted 
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --exit-code 1

  # ---------------- BUILD & TEST ----------------
  testing:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Maven Test
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

  # ---------------- SECURITY: TRIVY ----------------
  trivy:
    runs-on: self-hosted
    needs: testing
    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  # ---------------- DOCKER BUILD & PUSH ----------------
  docker_build_push:
    runs-on: self-hosted
    needs: trivy
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- APP ----------
      - name: Build & Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker-files/app/Dockerfile
          push: true
          tags: |
            ankim628/threevproapp:containers-${{ github.run_number }}

      # ---------- DB ----------
      - name: Build & Push DB Image
        uses: docker/build-push-action@v5
        with:
          context: Docker-files/db
          file: Docker-files/db/Dockerfile
          push: true
          tags: |
            ankim628/threevpromysql:containers-${{ github.run_number }}

      # ---------- WEB ----------
      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: Docker-files/web
          file: Docker-files/web/Dockerfile
          push: true
          tags: |
            ankim628/threevproweb:containers-${{ github.run_number }}
