# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Java CICD

on:
  push:
    branches: ["containers", "main"]
  pull_request:
    branches: ["containers"]

jobs:
  gitleaks: 
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --exit-code 1

  trivy:
    runs-on: self-hosted
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  docker_build_push:
    runs-on: self-hosted
    needs: trivy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- APP ----------
      - name: Build & Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker-files/app/Dockerfile
          push: true
          tags: |
            ankim628/threevproapp:containers-${{ github.run_number }}

      # ---------- DB ----------
      - name: Build & Push DB Image
        uses: docker/build-push-action@v5
        with:
          context: Docker-files/db
          file: Docker-files/db/Dockerfile
          push: true
          tags: |
            ankim628/threevpromysql:containers-${{ github.run_number }}

      # ---------- WEB ----------
      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: Docker-files/web
          file: Docker-files/web/Dockerfile
          push: true
          tags: |
            ankim628/threevproweb:containers-${{ github.run_number }}


